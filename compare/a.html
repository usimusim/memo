<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모 앱 Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;
    --label-blue-soft: #e8f3ff;
    --label-green-soft: #e3f8ec;
    --label-orange-soft: #fff1e5;
    --label-pink-soft: #ffeaf1;
    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-34: 34px;
    --space-64: 64px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-xl: 24px;
    --radius-full: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--surface-page);
    font-family: "Noto Sans KR", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  p, span { word-break: break-word; }
  button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
  svg { display: block; flex-shrink: 0; }

  .screen {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--surface-page);
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    padding: var(--space-64) var(--space-16) 0;
  }
  .main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
  }

  /* Header */
  .header { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-8); }
  .date { font-weight: 500; font-size: 15px; line-height: 22px; letter-spacing: -0.2px; color: var(--text-muted); }
  .headline { font-weight: 700; font-size: 28px; line-height: 38px; letter-spacing: -0.8px; color: var(--text-primary); }
  .headline em { font-style: normal; color: var(--color-primary); }

  /* Filter chips */
  .filter { display: flex; gap: var(--space-8); padding: 0 var(--space-4); }
  .chip {
    height: 36px; padding: 0 var(--space-16);
    display: flex; align-items: center;
    border-radius: var(--radius-full);
    background: var(--surface-card);
    font-weight: 700; font-size: 15px; line-height: 22px; letter-spacing: -0.2px;
    color: var(--text-secondary); white-space: nowrap;
  }
  .chip.selected { background: var(--color-primary); color: var(--text-on-primary); }

  /* Cards */
  .card { background: var(--surface-card); border-radius: var(--radius-xl); padding: var(--space-8) 0; display: flex; flex-direction: column; }
  .card-header {
    height: 40px; display: flex; align-items: center; gap: var(--space-4);
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card-title { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; line-height: 22px; letter-spacing: -0.2px; color: var(--text-primary); }
  .card-action { display: flex; align-items: center; gap: var(--space-4); font-weight: 500; font-size: 15px; line-height: 22px; letter-spacing: -0.2px; color: var(--text-muted); white-space: nowrap; }

  /* Memo item */
  .memo {
    height: 72px; display: flex; align-items: center; gap: var(--space-16);
    padding: var(--space-12) var(--space-20);
    text-decoration: none; color: inherit; cursor: pointer;
  }
  .tile { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tile.blue { background: var(--label-blue-soft); }
  .tile.green { background: var(--label-green-soft); }
  .tile.orange { background: var(--label-orange-soft); }
  .tile.pink { background: var(--label-pink-soft); }
  .memo-content { flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column; gap: var(--space-4); }
  .memo-title { font-weight: 700; font-size: 17px; line-height: 24px; letter-spacing: -0.3px; color: var(--text-primary); }
  .memo-preview {
    font-weight: 400; font-size: 14px; line-height: 20px; letter-spacing: -0.1px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .memo-date { font-weight: 500; font-size: 13px; line-height: 18px; color: var(--text-muted); white-space: nowrap; }

  /* Bottom primary button */
  .bottom { position: sticky; bottom: 0; background: var(--surface-page); padding-bottom: var(--space-34); }
  .btn-primary {
    width: 100%; height: 56px;
    display: flex; align-items: center; justify-content: center; gap: var(--space-8);
    padding: 0 var(--space-24);
    background: var(--color-primary); color: var(--text-on-primary);
    border-radius: var(--radius-md);
    font-weight: 700; font-size: 17px; line-height: 24px; letter-spacing: -0.2px;
  }
</style>
</head>
<body>
<div class="screen">
  <main class="main">
    <header class="header">
      <p class="date">10월 30일 금요일</p>
      <h1 class="headline">오늘까지 메모를<br><em>128개</em> 남겼어요</h1>
    </header>

    <div class="filter">
      <button class="chip selected">전체</button>
      <button class="chip">업무</button>
      <button class="chip">개인</button>
      <button class="chip">아이디어</button>
    </div>

    <section class="card">
      <div class="card-header">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 2.33333H10L9.4 5.8L11.3333 8H4.66667L6.6 5.8L6 2.33333Z" stroke="#3182F6" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 8V13.3333" stroke="#3182F6" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p class="card-title">고정한 메모</p>
      </div>
      <a class="memo">
        <div class="tile blue"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="#3182F6" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="memo-content"><p class="memo-title">디자인 리뷰 회의록</p><p class="memo-preview">검수 기준과 다음 할 일 정리</p></div>
        <p class="memo-date">오늘</p>
      </a>
      <a class="memo">
        <div class="tile green"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="#12A150" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="memo-content"><p class="memo-title">주말 등산 준비</p><p class="memo-preview">물 두 병, 간식, 바람막이 챙기기</p></div>
        <p class="memo-date">어제</p>
      </a>
    </section>

    <section class="card">
      <div class="card-header">
        <p class="card-title">최근 메모</p>
        <button class="card-action">전체 보기
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 4L10 8L6 12" stroke="#8B95A1" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <a class="memo">
        <div class="tile pink"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="#E5397A" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="memo-content"><p class="memo-title">장보기 목록</p><p class="memo-preview">우유, 계란, 사과, 커피 원두</p></div>
        <p class="memo-date">오늘</p>
      </a>
      <a class="memo">
        <div class="tile orange"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="#F76808" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="memo-content"><p class="memo-title">앱 아이콘 아이디어</p><p class="memo-preview">메모지 모서리가 접힌 모양</p></div>
        <p class="memo-date">오늘</p>
      </a>
      <a class="memo">
        <div class="tile green"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.41667 3.66667H12.8333L16.5 7.33333V18.3333H6.41667V3.66667Z M12.8333 3.66667V7.33333H16.5M9.16667 11H13.75M9.16667 14.6667H13.75" stroke="#12A150" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="memo-content"><p class="memo-title">읽을 책</p><p class="memo-preview">디자인 시스템 책 두 권</p></div>
        <p class="memo-date">어제</p>
      </a>
    </section>
  </main>

  <div class="bottom">
    <button class="btn-primary">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 4.16667V15.8333M4.16667 10H15.8333" stroke="white" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/></svg>
      새 메모 쓰기
    </button>
  </div>
</div>
</body>
</html>
